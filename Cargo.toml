[package]
name = "coffee"
version = "0.2.1"
edition = "2024"

[dependencies]
inkwell = { version = "0.7.1", features = ["llvm21-1"] }
nom = "8.0.0"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
fs2 = "0.4"
scopeguard = "1.2"
clang-sys = { version = "1.8", features = ["clang_17_0"] }
libc = "0.2"
