[package]
name = "coffee"
version = "0.3.9"
edition = "2024"
build = "build.rs"

[dependencies]
# inkwell 0.8+ / 0.9+ default toward LLVM 22; stay on 0.7.1 for llvm21-1 + this machine's 21.1.8.
inkwell = { version = "0.7.1", features = ["llvm21-1"] }
nom = "8.0.0"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }
ureq = "2.12"
tar = "0.4"
flate2 = "1"
rayon = "1.12"
fs2 = "0.4"
scopeguard = "1.2"
# 1.9.1 max feature is clang_20_0 (no clang_21_0 yet). Runtime libclang is still 21.1.8.
clang-sys = { version = "1.9", features = ["clang_20_0"] }
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
