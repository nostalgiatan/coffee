name: release

# A tag `v*` runs the whole ci, then builds the compiler and its tools for x86-64 and, cross compiled by that
# compiler, for riscv64 (base and rva23) and aarch64, and publishes the archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Build from the seed
        run: coffee/driver/tools/build-from-seed.sh "$RUNNER_TEMP/w"
      - name: Package every target
        run: |
          for t in x86_64-linux riscv64-linux riscv64-linux-rva23 aarch64-linux; do
            coffee/driver/tools/package.sh "$RUNNER_TEMP/w" "${GITHUB_REF_NAME}" "$t" dist
          done
      # a cross compiled compiler runs under qemu and compiles a program
      - name: Smoke test the cross archives
        run: |
          printf 'fn main() => int:\n    return 42\n' > smoke.cf
          for pair in riscv64:qemu-riscv64 aarch64:qemu-aarch64; do
            a=${pair%%:*}; q=${pair#*:}
            d=dist/coffee-${GITHUB_REF_NAME}-linux-$a
            "$q" "$d/bin/coffee2" smoke.cf --target=$a-linux --static -o smoke.$a
            set +e; "$q" smoke.$a; rc=$?; set -e
            [ "$rc" = 42 ] || { echo "::error::$a archive: smoke test returned $rc"; exit 1; }
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "Coffee ${GITHUB_REF_NAME}" --generate-notes
